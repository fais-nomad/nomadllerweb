<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomadller | Agent Login</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/src/admin.css">
</head>
<body class="admin-body">
    <a href="/index.html" style="position: absolute; top: 2rem; left: 2rem; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; transition: color 0.3s; z-index: 10;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--text-secondary)'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Home
    </a>
    <div class="login-container">
        <div class="login-card reveal">
            <div class="login-header">
                <div class="login-logo">NOMADLLER</div>
                <div class="login-subtitle">B2B Agent Portal</div>
            </div>
            
            <form id="agent-access-form" class="login-form">
                <div class="form-group">
                    <label for="agent-code">Agent Code</label>
                    <input type="text" id="agent-code" required placeholder="Enter your unique code">
                </div>
                <button type="submit" class="login-btn">ACCESS PORTAL</button>
            </form>
            <div id="login-error" style="color: var(--admin-danger); text-align: center; margin-top: 1rem; display: none; font-size: 0.85rem;">
                Invalid Agent Code. Access denied.
            </div>
        </div>
    </div>

    <!-- Re-using gsap and our agent auth logic -->
    <script type="module" src="/src/agent-auth.js"></script>
    <script type="module">
        import gsap from 'gsap';
        document.addEventListener('DOMContentLoaded', () => {
            gsap.fromTo('.login-card', 
                { y: 50, opacity: 0 }, 
                { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }
            );
        });
    </script>
</body>
</html>
