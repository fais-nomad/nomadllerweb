<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Nomadller | Agent Login | Nomadller Trekking Company</title>
<link href="/style.css" rel="stylesheet"/>
<link href="/src/admin.css" rel="stylesheet"/>
<meta content="Nomadller provides top trekking and adventure experiences. Join us for an unforgettable expedition." name="description"/></head>
<body class="admin-body"><h1 style="display:none;">Nomadller | Agent Login</h1>
<a href="/" onmouseout="this.style.color='var(--text-secondary)'" onmouseover="this.style.color='white'" style="position: absolute; top: 2rem; left: 2rem; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; transition: color 0.3s; z-index: 10;">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
        Back to Home
    </a>
<div class="login-container">
<div class="login-card reveal">
<div class="login-header">
<div class="login-logo">NOMADLLER</div>
<div class="login-subtitle">B2B Agent Portal</div>
</div>
<form class="login-form" id="agent-access-form">
<div class="form-group">
<label for="agent-code">Agent Code</label>
<input id="agent-code" placeholder="Enter your unique code" required="" type="text"/>
</div>
<button class="login-btn" type="submit">ACCESS PORTAL</button>
</form>
<div id="login-error" style="color: var(--admin-danger); text-align: center; margin-top: 1rem; display: none; font-size: 0.85rem;">
                Invalid Agent Code. Access denied.
            </div>
</div>
</div>
<!-- Re-using gsap and our agent auth logic -->
<script src="/src/agent-auth.js" type="module"></script>
<script type="module">
        import gsap from 'gsap';
        document.addEventListener('DOMContentLoaded', () => {
            gsap.fromTo('.login-card', 
                { y: 50, opacity: 0 }, 
                { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }
            );
        });
    </script>
</body>
</html>
