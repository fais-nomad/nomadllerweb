<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Nomadller | Admin Portal | Nomadller Trekking Company</title>
<link href="/style.css" rel="stylesheet"/>
<link href="/src/admin.css" rel="stylesheet"/>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://nomadller.com/admin" rel="canonical"/><meta content="Nomadller provides top trekking and adventure experiences. Join us for an unforgettable expedition." name="description"/></head>
<body class="admin-body"><h1 style="display:none;">Nomadller | Admin Portal</h1>
<a href="/index.html" onmouseout="this.style.color='var(--text-secondary)'" onmouseover="this.style.color='white'" style="position: absolute; top: 2rem; left: 2rem; color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: color 0.3s; font-family: 'Space Grotesk', sans-serif;">
<i class="ph ph-arrow-left"></i> Back to Home
    </a>
<div class="login-container">
<div class="login-card reveal">
<div class="login-header">
<div class="login-logo">NOMADLLER</div>
<div class="login-subtitle">Command Center Portal</div>
</div>
<form class="login-form" id="admin-login-form">
<div class="form-group">
<label for="username">Admin ID</label>
<input id="username" placeholder="Enter your ID" required="" type="text"/>
</div>
<div class="form-group">
<label for="password">Security Key</label>
<input id="password" placeholder="Enter security key" required="" type="password"/>
</div>
<button class="login-btn" type="submit">AUTHENTICATE</button>
</form>
<div id="login-error" style="color: var(--admin-danger); text-align: center; margin-top: 1rem; display: none; font-size: 0.85rem;">
                Invalid credentials. Access denied.
            </div>
</div>
</div>
<script src="/src/admin.js" type="module"></script>
</body>
</html>
