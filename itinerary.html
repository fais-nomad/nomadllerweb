<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nomadller | Your Exclusive Luxury Itinerary</title>
<meta content="Nomadller | Your Exclusive Luxury Itinerary" property="og:title"/>
<meta content="View the details of your upcoming expedition, curated exclusively by Nomadller Luxury Expeditions." property="og:description"/>
<meta content="website" property="og:type"/>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap');

        :root {
            --ivory: #FDFAF5;
            --paper-light: #FFFFFF;
            --navy: #1A2A1A;
            --charcoal: #1A1A1A;
            --stone: #5A6A7A;
            --orange: #B84500;
            --teal: #1A5F7A;
            --white: #FFFFFF;
            
            --font-display: 'Lora', serif;
            --font-body: 'Source Sans 3', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: #e0e0e0; /* Just for web preview */
            color: var(--charcoal);
            -webkit-font-smoothing: antialiased;
        }

        /* PDF Page Sizing (A4 dimensions at 96 DPI) */
        .page {
            width: 210mm;
            height: 296.8mm;
            background: var(--paper-light);
            position: relative;
            overflow: hidden;
            page-break-after: always;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 0 auto 20px;
        }

        /* Texture Grain Overlay */
        .page::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 999;
        }

        /* Global Typography Classes */
        .t-serif { font-family: var(--font-display); }
        .t-sans { font-family: var(--font-body); }
        .t-micro {
            font-family: var(--font-body);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--stone);
        }

        /* Micro-Luxury Elements */
        .gps-coords {
            position: absolute;
            transform: rotate(-90deg);
            transform-origin: left bottom;
            left: 20px;
            bottom: 60px;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: rgba(28,35,49,0.3);
            text-transform: uppercase;
        }

        .dark-page .gps-coords {
            color: rgba(255,255,255,0.2);
        }

        .altitude-stamp {
            border: 1px solid var(--orange);
            color: var(--orange);
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 15px;
        }

        .seal {
            position: absolute;
            top: 40px; left: 40px;
            width: 80px; height: 80px;
            border: 1px dashed rgba(28,35,49,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.55rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--charcoal);
        }
        .dark-page .seal {
            border-color: rgba(255,255,255,0.2);
            color: var(--white);
        }

        /* Standard Page Structure */
        .page-content {
            padding: 80px 60px 110px 60px;
            height: 100%;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
        }

        .page-footer {
            position: absolute;
            bottom: 40px;
            left: 60px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(28,35,49,0.4);
            border-top: 1px solid rgba(28,35,49,0.1);
            padding-top: 20px;
            z-index: 10;
        }

        .dark-page .page-footer {
            color: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.1);
        }

        /* Cover Page Redesign */
        .cover-page {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 80px 60px;
            background-size: cover;
            background-position: center;
            color: var(--white);
            position: relative;
        }

        .cover-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(11,17,32,0.2) 0%, rgba(11,17,32,0.8) 100%);
        }

        .brand-badge {
            font-family: var(--font-body);
            font-size: 0.85rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .cover-title {
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 1.05;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
            font-weight: 400;
        }

        .cover-subtitle {
            font-family: var(--font-body);
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.8);
            position: relative;
            z-index: 2;
            margin-bottom: 60px;
        }

        /* Price Card */
        .price-card {
            position: absolute;
            top: 60px;
            right: 60px;
            background: rgba(252, 251, 249, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 30px 40px;
            border-radius: 2px;
            text-align: right;
            color: var(--charcoal);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .price-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #000;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 10px;
        }
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .price-item {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--charcoal);
            line-height: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }
        .price-item span {
            font-family: var(--font-body);
            font-size: 0.75rem;
            color: var(--orange);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Quote Page */
        .quote-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px;
            background: var(--navy);
        }
        .large-quote {
            font-family: var(--font-display);
            font-size: 3rem;
            line-height: 1.3;
            color: var(--white);
            font-weight: 400;
            margin-bottom: 40px;
            font-style: italic;
        }
        .large-quote span { color: var(--orange); }
        .quote-author {
            font-family: var(--font-body);
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--stone);
        }

        /* Map Infographic Page */
        .map-page {
            background: var(--paper-light);
            color: var(--charcoal);
        }
        .map-title {
            font-family: var(--font-display);
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: var(--charcoal);
        }

        /* Editorial Headers */
        .section-heading {
            font-family: var(--font-display);
            font-size: 2.6rem;
            color: var(--charcoal);
            line-height: 1.25;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .section-subheading {
            font-family: var(--font-body);
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--orange);
            font-weight: 600;
            margin-bottom: 40px;
        }

        /* Day Formatting */
        .day-container {
            display: flex;
            gap: 28px;
            margin-bottom: 36px;
            position: relative;
        }
        .day-container::after {
            content: '';
            position: absolute;
            bottom: -18px; left: 0; right: 0;
            height: 1px;
            background: rgba(0,0,0,0.08);
        }
        .day-number {
            font-family: var(--font-display);
            font-size: 2.8rem;
            color: var(--orange);
            opacity: 0.22;
            line-height: 0.85;
            min-width: 56px;
            font-weight: 700;
        }
        .day-details { flex: 1; }
        .day-title {
            font-family: var(--font-display);
            font-size: 1.55rem;
            color: #111111;
            margin-bottom: 10px;
            font-weight: 700;
            line-height: 1.3;
        }
        .day-desc {
            font-family: var(--font-body);
            font-size: 1.1rem;
            line-height: 1.8;
            color: #1A1A1A;
            margin-bottom: 16px;
            font-weight: 400;
            letter-spacing: 0.15px;
        }
        .day-metrics {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .metric-badge {
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 7px 14px;
            background: #F2EEE6;
            border: 1.5px solid rgba(0,0,0,0.12);
            color: #1A1A1A;
            border-radius: 6px;
        }

        /* Split Pages & Experience Spreads */
        .split-page {
            display: flex;
            flex-direction: row;
        }
        .split-content {
            flex: 1;
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .split-image {
            flex: 1.2;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .spread-page {
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spread-box {
            background: rgba(255,255,255,0.95);
            padding: 50px;
            max-width: 500px;
            text-align: center;
        }

        /* Philosophy Dark Page */
        .philosophy-page {
            background: var(--navy);
            color: var(--white);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 100px;
        }
        .phil-title {
            font-family: var(--font-display);
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 40px;
        }
        .phil-text {
            font-size: 1.1rem;
            line-height: 2;
            color: rgba(255,255,255,0.7);
            max-width: 600px;
            margin: 0 auto 50px;
            font-weight: 300;
        }

        /* Climax Page Restyling */
        .climax-page {
            background: var(--navy);
            color: var(--white);
        }
        .c-metric { border-left: 2px solid var(--orange); padding-left: 15px; }

        /* Data Grids */
        .data-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 30px; 
        }
        .data-card {
            background: #FFFFFF;
            border: 1.5px solid rgba(0,0,0,0.09);
            border-radius: 8px;
            padding: 28px 30px;
        }
        .data-card h3 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 18px;
            color: #111111;
            border-bottom: 2px solid var(--orange);
            padding-bottom: 10px;
        }
        .data-card ul { list-style: none; }
        .data-card li {
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 10px;
            color: #1A1A1A;
            padding-left: 20px;
            position: relative;
            line-height: 1.65;
        }
        .data-card li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--orange);
            font-weight: 700;
        }

        .policy-h4 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            color: #111111;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--orange);
            padding-bottom: 8px;
        }

    </style>

</body>
</html>
